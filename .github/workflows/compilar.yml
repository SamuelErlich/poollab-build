# Substitua .github/workflows/compilar.yml e o ZIP de fontes na raiz do repositorio.
# Inicie uma NOVA execucao em Actions > Compilar SDKPool > Run workflow.
# Resultado: IPA V9 completo para assinar no GBox. Nao precisa devolver o framework.
# O link da base V4 abaixo expira em 20/10/2026; um novo link deve apontar ao mesmo IPA sem reassinar.

name: Compilar SDKPool

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: Nome da sua aplicacao KeyAuth (AppName)
        required: true
        type: string
      owner_id:
        description: OwnerID da sua aplicacao KeyAuth
        required: true
        type: string
      app_version:
        description: Versao cadastrada no KeyAuth
        required: true
        default: '1.0'
        type: string
      subscription:
        description: Nome do plano exigido (opcional)
        required: false
        default: ''
        type: string
      base_ipa_url:
        description: Link direto da base PoolLab V4 verificada (pode manter o preenchido)
        required: true
        default: 'https://filebin.net/4e4fa669b4a393a78d2a168e/8BallPool_56.31.0_PoolLab_v4_unsigned.ipa'
        type: string

permissions:
  contents: read

concurrency:
  group: poollab-compilar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Baixar os arquivos do repositorio
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Conferir e abrir os fontes V9
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import zipfile

          source = Path('SDKPool_Fontes.zip')
          if not source.is_file():
              raise SystemExit('Envie SDKPool_Fontes.zip para a raiz do repositorio, sem extrair.')
          if source.stat().st_size != 1544119:
              raise SystemExit('ZIP de outra versao. Substitua o ZIP e o workflow pelo par V9 recebido.')
          if hashlib.sha256(source.read_bytes()).hexdigest() != 'd7811c670050b0a65fa5fb1062074042602bf0ecb43aa33f50bc8c60e7e0dd32':
              raise SystemExit('O ZIP mudou. Use o arquivo V9 original recebido junto deste workflow.')
          destination = Path('_poollab_build')
          destination.mkdir(exist_ok=False)
          with zipfile.ZipFile(source) as archive:
              archive.extractall(destination)
          root = destination / 'PoolLab'
          manifest = json.loads((root / 'MANIFESTO_SHA256.json').read_text())
          for relative, expected in manifest.items():
              if hashlib.sha256((root / relative).read_bytes()).hexdigest() != expected:
                  raise SystemExit('Falha na integridade dos fontes: ' + relative)
          project = (root / 'PoolLab.xcodeproj/project.pbxproj').read_text()
          if project.count('CURRENT_PROJECT_VERSION = 9;') != 2:
              raise SystemExit('Esta execucao exige SDKPool V9, build 9.')
          for name in ('upgrade_poollab_ipa.py', 'download_poollab_base.py', 'build_integration_framework.sh'):
              if not (root / 'scripts' / name).is_file():
                  raise SystemExit('Script necessario ausente: ' + name)
          print('Fontes V9 conferidos.')
          PY

      - name: Baixar e conferir a base do jogo
        working-directory: _poollab_build/PoolLab
        env:
          POOLLAB_BASE_IPA_URL: ${{ inputs.base_ipa_url }}
        run: |
          set -euo pipefail
          python3 scripts/download_poollab_base.py --url "$POOLLAB_BASE_IPA_URL" --output ../base_poollab_v4.ipa

      - name: Testar e compilar para iPhone
        working-directory: _poollab_build/PoolLab
        env:
          KEYAUTH_APP_NAME: ${{ inputs.app_name }}
          KEYAUTH_OWNER_ID: ${{ inputs.owner_id }}
          KEYAUTH_VERSION: ${{ inputs.app_version }}
          KEYAUTH_SUBSCRIPTION: ${{ inputs.subscription }}
        run: |
          set -euo pipefail
          bash scripts/build_integration_framework.sh 2>&1 | tee poollab-build.log

      - name: Montar e verificar o IPA V9
        working-directory: _poollab_build/PoolLab
        run: |
          set -euo pipefail
          mkdir ../framework_v9
          /usr/bin/ditto -x -k dist/PoolLabIntegration_unsigned.framework.zip ../framework_v9
          python3 scripts/upgrade_poollab_ipa.py \
            --ipa ../base_poollab_v4.ipa \
            --framework ../framework_v9/PoolLabIntegration.framework \
            --output dist/8BallPool_56.31.0_SDKPool_v9_unsigned.ipa
          shasum -a 256 dist/8BallPool_56.31.0_SDKPool_v9_unsigned.ipa > dist/8BallPool_56.31.0_SDKPool_v9_unsigned.ipa.sha256

      - name: Disponibilizar o IPA completo para o GBox
        uses: actions/upload-artifact@v7
        with:
          name: SDKPool-V9-IPA
          path: |
            _poollab_build/PoolLab/dist/8BallPool_56.31.0_SDKPool_v9_unsigned.ipa
            _poollab_build/PoolLab/dist/8BallPool_56.31.0_SDKPool_v9_unsigned.manifest.json
            _poollab_build/PoolLab/dist/8BallPool_56.31.0_SDKPool_v9_unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Mostrar onde baixar
        run: |
          printf '%s\n' 'Baixe o artefato SDKPool-V9-IPA nesta pagina. Extraia o ZIP e importe o arquivo .ipa no GBox para assinar e instalar. O funcionamento em partida ainda precisa de validacao no iPhone.' >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar o log para corrigir eventual erro
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SDKPool-log-da-compilacao
          path: _poollab_build/PoolLab/poollab-build.log
          if-no-files-found: ignore
          retention-days: 7
